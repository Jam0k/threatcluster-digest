name: Mirror the digest

on:
  schedule:
    # The daily edition goes out at 06:00 UTC and the weekly at 06:30 on
    # Mondays. Two runs, so a late send is still picked up the same morning.
    - cron: "45 6 * * *"
    - cron: "45 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/mirror.py
      - name: Commit new issues
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add issues README.md
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "Digest $(date -u +%Y-%m-%d)"
            git push
          fi
